name: Linear Release

run-name: Linear release for ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

# Marks the Linear tickets that shipped in a tag as Released, using the shared
# workflow-stack `linear-release` action in `range` mode — the same release-sweep
# contract unraid/core uses. The shipped set comes from the pull requests merged
# into the release range; only tickets sitting in `source-state` move, so
# anything still in QA is left alone.
#
# This repository no longer writes Linear *release objects* or their stages.
# Those are owned by notification-worker, which creates them from real
# release-diff builds. The previous repo-local writer inferred "released" from
# tag shape alone, which marked Unraid OS 7.3.3 Stable released on 2026-07-21
# from a tag that was later deleted.

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to sync to Linear"
        required: true
        type: string
      dry_run:
        description: "Report the tickets that would move without updating Linear"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: linear-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  linear-release:
    if: github.repository == 'unraid/webgui'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release range
        id: tag
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          git fetch --force --tags origin

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "Tag name is required" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Tag '${TAG_NAME}' does not exist in this repository" >&2
            exit 1
          fi

          # A prerelease tag (7.3.3-rc.0.1) is an internal build; a bare x.y.z
          # tag is the public release. Only the public tag sweeps tickets to
          # Released — see the PR description about extending this to internal
          # tags.
          if [[ "$TAG_NAME" == *"-"* ]]; then
            RELEASE_CHANNEL="internal"
          elif [[ "$TAG_NAME" =~ ^[0-9]{1,2}\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_CHANNEL="public"
          else
            echo "Unsupported release tag format: ${TAG_NAME}" >&2
            exit 1
          fi

          # The major is bounded to two digits on purpose: this repository still
          # carries legacy date tags (2016.08.18) that otherwise satisfy an
          # unbounded x.y.z pattern and pollute the ordering.
          STABLE_RE='^[0-9]{1,2}\.[0-9]+\.[0-9]+$'
          ANY_RE='^[0-9]{1,2}\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'

          # A stable tag is cut at the SAME commit as its final release
          # candidate (7.3.2 and 7.3.2-rc.1 are both 369f0b29), so bounding a
          # public release by the immediately preceding tag yields an empty
          # range and sweeps nothing. Bound it by the previous *stable* tag so
          # the range covers everything that reached users since the last
          # public release.
          if [ "$RELEASE_CHANNEL" = "public" ]; then
            CANDIDATE_TAGS="$(git tag --list '[0-9]*' | grep -E "$STABLE_RE" | sort -V)"
          else
            CANDIDATE_TAGS="$(git tag --list '[0-9]*' | grep -E "$ANY_RE" | sort -V)"
          fi

          PREVIOUS_TAG="$(
            printf '%s\n' "$CANDIDATE_TAGS" \
              | awk -v tag="$TAG_NAME" '$0 == tag { print previous; exit } { previous = $0 }'
          )"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Could not resolve the tag preceding '${TAG_NAME}' among ${RELEASE_CHANNEL} tags." >&2
            echo "Re-run this workflow manually once the bounding tag exists." >&2
            exit 1
          fi

          RANGE_COMMITS="$(git rev-list --count "${PREVIOUS_TAG}..${TAG_NAME}")"

          {
            echo "tag_name=${TAG_NAME}"
            echo "previous_tag=${PREVIOUS_TAG}"
            echo "release_channel=${RELEASE_CHANNEL}"
            echo "range_commits=${RANGE_COMMITS}"
          } >> "$GITHUB_OUTPUT"

          echo "Release range ${PREVIOUS_TAG}..${TAG_NAME} (${RELEASE_CHANNEL}): ${RANGE_COMMITS} commit(s)"

      - name: Release Linear tickets shipped in this tag
        if: steps.tag.outputs.release_channel == 'public'
        uses: unraid/limetech-workflow-stack/actions/linear-release@main
        with:
          mode: range
          repository: ${{ github.repository }}
          team-key: OS
          source-state: Approved For Release
          released-state: Released
          previous-tag: ${{ steps.tag.outputs.previous_tag }}
          summary: "true"
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
